<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="./styles/checkout.css">
</head>

<body>
    <div class="main-container">
        <nav>
            <div class="brand-logo">
                <img src="./assets/logo/amazon-logo.png" alt="Amazon logo">
            </div>
            <div class="middle-section">
                <p>Checkout (<span class="js-cart-quantity">0</span> items)</p>
            </div>
            <div class="right-section">
                <img src="./assets/images/icons/checkout-lock-icon.png" alt="Lock Icon">
            </div>

        </nav>
        <section class="checkout-container">
            <h2>Review your order</h2>
            <div class="wrapper-container">
                <div class="order-products js-order-products">
                   
                </div>
                <div class="order-summary js-order-summary">
                   
                </div>

        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script type="module" src="scripts/checkout.js"></script>

</body>

</html>
