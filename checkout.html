<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="./styles/checkout.css">
</head>

<body>
    <div class="main-container">
        <nav>
            <div class="brand-logo">
                <img src="./assets/logo/amazon-logo.png" alt="Amazon logo">
            </div>
            <div class="middle-section">
                <p>Checkout (<span class="js-cart-quantity">0</span> items)</p>
            </div>
            <div class="right-section">
                <img src="./assets/images/icons/checkout-lock-icon.png" alt="Lock Icon">
            </div>

        </nav>
        <section class="checkout-container">
            <h2>Review your order</h2>
            <div class="wrapper-container">
                <div class="order-products js-order-products">
                   
                </div>
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div class="order-summary-details">
                        <p><span>Items (3):</span> <span class="js-subtotal-amount">0</span></p>
                        <p><span>Shipping & handling:</span> <span class="js-shipping-and-handling-amount">0</span></p>
                        <p><span>Total before tax:</span> <span class="js-before-tax-amount">0</span></p>
                        <p><span>Estimated tax (10%):</span> <span class="js-after-tax-amount">0</span></p>
                    </div>
                    <div>
                        <span>Order total:</span>
                        <span class="js-order-total-amount">0</span>
                    </div>
                    <button class="checkout-button">Place your order</button>
                </div>

        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script type="module" src="scripts/checkout.js"></script>

</body>

</html>
