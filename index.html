<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles/index.css">
</head>

<body>
    <div class="main-conatiner">
        <!-- Navigation -->
        <nav>
            <div class="brand-logo">
                <img src="./assets/logo/amazon-logo.png" alt="Amazon logo" height="10" width="10">
            </div>
            <div class="search-bar">
                <div class="wrapper">
                    <input type="text" placeholder="Search">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="other-rhs-links">
                <p><span>Returns</span> <span>& Orders</span></p>
                <p>
                    <span>
                        <img src="./assets/cart-white-color.png" alt="Cart Image">
                        <span class="js-cart-quantity">0</span>
                    </span>
                </p>
            </div>
        </nav>

        <!-- Products -->
        <div class="products-container js-products-container">
        </div>
    </div>
    <script src="./data/cart.js"></script>
    <script src="./data/products.js"></script>
    <script src="./scripts/index.js"></script>
</body>

</html>
